# Tool Search Eval Set — 58 prompts × expected tools
#
# Measures recall@10 on POST /mcp/tool-search against the production endpoint.
# Ship gate: overall recall@10 ≥ 90%.
#
# Structure:
# - funnel       (17): one per stage of discovery_funnel_interactive, covers
#                      the load-bearing agent-mode path end-to-end (incl FEP)
# - compute      (10): Compute-tier sync tools — pKa, solubility, BDE,
#                      frontier orbitals, redox, excited states, QM, NNP
# - materials     (5): materials-science workflows (OLED, electrolyte,
#                      reaction thermo, activation barriers, MP lookups)
# - tree-retrieval(6): tree-guided chemical space exploration, vector search,
#                      funnel audit listing
# - ambiguous    (10): queries where multiple tools are plausible — tests
#                      whether the index discriminates vs collides
# - adversarial   (5): paraphrases that should still land on the right tool
# - negative      (5): queries that should NOT surface any tool strongly
#
# `expected` lists tools that MUST appear in the top-10 for the query.
# `nice_to_have` lists tools that would be reasonable to also surface but
# don't count against recall if absent. Negative cases use `should_not_surface`
# to flag tools that, if they appear in top-3, indicate a false-positive
# routing problem.
#
# When a tool description changes materially, re-run this eval and commit
# the new baseline if recall still passes. See docs/NovoMCP/AGENT-SDK-TOOL-SEARCH.md

version: 3
endpoint: /mcp/tool-search
top_k: 10
ship_gate_recall_at_10: 0.90

#
# RETIRED 2026-10-27 — four cases removed. predict_clinical_outcomes and
# run_fep_check are no longer in the catalog: the free-energy path is not in
# the open release and the clinical-outcome tool was withdrawn. They cannot be
# retrieved, so scoring them measures the catalog, not the ranker. Removing
# them moves the denominator from 58 cases to 54. Retired ids:
#   funnel-stage5p5-clinical-gate, funnel-stage6p5-fep,
#   funnel-stage6p5-fep-paraphrase, adv-clinical-outcomes-natural
#
cases:
  # ─────────────────────────────────────────────────────────────────────
  # Funnel stage coverage (15)
  # ─────────────────────────────────────────────────────────────────────
