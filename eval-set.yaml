  - id: funnel-stage3-seed-char
    category: funnel
    query: "Run ADMET predictions for this molecule"
    expected: [predict_admet]

  - id: funnel-stage3-compliance
    category: funnel
    query: "Is this molecule compliant for pharmaceutical development in the US?"
    expected: [check_compliance]

  - id: funnel-stage4-lead-opt
    category: funnel
    query: "Generate scaffold-hopping variants of this seed molecule"
    expected: [lead_optimization]
    nice_to_have: [optimize_molecule]

  - id: funnel-stage4-optimize-molmim
    category: funnel
    query: "Optimize this molecule's properties while keeping it structurally similar"
    expected: [optimize_molecule]
    nice_to_have: [lead_optimization]

  - id: funnel-stage5-docking
    category: funnel
    query: "Dock these three compounds against EGFR and report binding affinities"
    expected: [dock_molecules]
    nice_to_have: [get_protein_structure]

  - id: funnel-stage6-md
    category: funnel
    query: "Run a molecular dynamics simulation on this protein-ligand complex"
