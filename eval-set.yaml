  - id: funnel-stage2-literature
    category: funnel
    query: "Find peer-reviewed papers about KRAS inhibitors"
    expected: [search_literature]
    nice_to_have: [search_biorxiv]

  - id: funnel-stage2-biorxiv
    category: funnel
    query: "Are there any recent preprints on BRAF inhibitor resistance?"
    expected: [search_biorxiv]
    nice_to_have: [search_literature]

  - id: funnel-stage2-chembl
    category: funnel
    query: "Find ChEMBL bioactivity data for CDK4 inhibitors with IC50 measurements"
